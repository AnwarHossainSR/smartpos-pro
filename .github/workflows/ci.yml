name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartpos_test
          POSTGRES_USER: smartpos
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, bcmath, intl, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Dependency audit (Composer)
        run: composer audit --no-interaction

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: smartpos_test
          DB_USERNAME: smartpos
          DB_PASSWORD: secret
        run: php artisan test

  web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Dependency audit (npm)
        # Ignored: transitive dev-tooling-only deps (eslint/next/vitest toolchain, never
        # shipped in the production bundle) with no non-breaking fix available yet.
        # GHSA-mh99-v99m-4gvg (brace-expansion via eslint), GHSA-6g55-p6wh-862q /
        # GHSA-r28c-9q8g-f849 (postcss via next/vite build tooling), GHSA-f88m-g3jw-g9cj
        # (sharp, next's optional image-optimizer binary — not called directly by app code).
        run: >-
          bun audit --audit-level=high
          --ignore=GHSA-mh99-v99m-4gvg
          --ignore=GHSA-6g55-p6wh-862q
          --ignore=GHSA-r28c-9q8g-f849
          --ignore=GHSA-f88m-g3jw-g9cj

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
