name: MySQL schema & tests

# The main test job runs on SQLite because it is fast and needs no service
# container. But SQLite has no 3072-byte index key limit and no 64-character
# identifier limit, so it is structurally incapable of catching two whole classes
# of MySQL failure — both of which reached a developer's machine before this job
# existed. This runs the same suite against the database production actually uses.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: smartpos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Job-level env wins over .env: phpdotenv does not overwrite variables that
    # are already set in the environment.
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: smartpos_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      # Laravel writes the collation into each CREATE TABLE, so this holds even
      # though the service container starts with the server default.
      DB_COLLATION: utf8mb4_0900_as_cs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Runs before the suite so a schema failure reports as a schema failure
      # rather than as several hundred confusing test errors.
      - name: Migrate
        run: php artisan migrate --no-interaction --force

      - name: Assert collation is case- and accent-sensitive
        run: |
          php -r '
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=smartpos_test", "root", "secret");
            $rows = $pdo->query("select distinct table_collation from information_schema.tables
                                 where table_schema = \"smartpos_test\" and table_type = \"BASE TABLE\"")
                        ->fetchAll(PDO::FETCH_COLUMN);
            foreach ($rows as $c) {
                if ($c !== "utf8mb4_0900_as_cs") {
                    fwrite(STDERR, "Unexpected collation: $c\n");
                    exit(1);
                }
            }
            echo "collation ok: ", implode(", ", $rows), "\n";
          '

      - name: Seed
        run: php artisan db:seed --no-interaction --force

      # phpunit.xml pins DB_CONNECTION=sqlite for the fast job. Strip those two
      # lines rather than relying on whether <env> overrides a real environment
      # variable — the answer varies by PHPUnit version, and a silent fallback to
      # SQLite here would make this entire job a no-op that always passes.
      - name: Build MySQL PHPUnit config
        run: sed -e '/DB_CONNECTION/d' -e '/DB_DATABASE/d' phpunit.xml > phpunit.mysql.xml

      - name: Run tests
        run: php vendor/bin/phpunit --configuration phpunit.mysql.xml --colors=never
