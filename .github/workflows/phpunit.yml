name: PHPUnit Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # composer.json requires PHP 8.4, which is not what ubuntu-latest ships.
      # pcov is what makes --coverage-clover possible; without a coverage driver
      # PHPUnit fails the run rather than skipping the report.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: bcmath, gd, intl, pdo_sqlite, sqlite3, zip

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies
        run: bun install --frozen-lockfile

      # `key:generate` writes into .env, so the file has to exist first.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Run phpunit with coverage
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml \
            --coverage-clover build/coverage/clover.xml \
            --colors=never
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: ignore
