# SmartPOS Pro — local development stack.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpos-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smartpos
      DB_USERNAME: smartpos
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

  nginx:
    image: nginx:1.27-alpine
    container_name: smartpos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: smartpos-mysql
    restart: unless-stopped
    # Case- and accent-sensitive, to match the collation the schema is designed
    # against. MySQL's default folds both, which would turn every unique index on
    # sku/barcode/email into a looser constraint than the app expects.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_as_cs
    environment:
      MYSQL_DATABASE: smartpos
      MYSQL_USER: smartpos
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartpos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpos-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

volumes:
  mysqldata:
